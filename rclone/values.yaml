rclone-s3-gateway:
  replicaCount: 1
  image:
    # Gepinnter Tag, kein "latest": bei pullPolicy IfNotPresent würde "latest"
    # still auf einem alten Image stehen bleiben. Gleiche Konvention wie storj/values.yaml.
    #
    # ACHTUNG - Registry: rclone/rclone auf Docker Hub veroeffentlicht KEINE
    # semver-Tags. Es gibt dort nur v1.75-stable (rollierend), latest, beta,
    # master, test und sha-*. Ein "rclone/rclone:v1.75.1" existiert dort nicht
    # (HTTP 404) und liefert ErrImagePull. Die semver-Tags gibt es nur bei
    # GHCR - dort aber OHNE "v"-Praefix, "v1.75.1" ist dort ebenfalls 404.
    repository: ghcr.io/rclone/rclone
    tag: "1.75.1"
    pullPolicy: IfNotPresent
  # Das Image setzt bereits ENTRYPOINT ["rclone"], deshalb args statt command.
  #
  # WICHTIG: "serve s3" kennt kein "--s3-key", "--s3-secret" oder "--no-auth".
  # Die Signatur erfolgt ueber SigV4 mittels "--auth-key ACCESS,SECRET" oder
  # ueber die Umgebungsvariable RCLONE_AUTH_KEY (siehe env unten).
  # Ohne Auth-Key erlaubt serve s3 anonymen Zugriff.
  #
  # Serve-Pfad ist die Crypt-REMOTE-WURZEL (hetzner-crypt:), NICHT
  # hetzner-crypt:nas-backup/. "serve s3" verwendet den angegebenen Pfad als
  # WURZEL, und die Buckets sind die Unterverzeichnisse DIESES Pfades.
  # Mit "hetzner-crypt:nas-backup/" waere der Bucket-Container also der
  # Inhalt von nas-backup/ - die Bucket-Liste waere leer und das NAS
  # haette gar kein Ziel. Empirisch mit v1.75.1 verifiziert.
  #
  # Bucket-Namen sind trotz filename_encryption=standard lesbar: rclones
  # Crypt-Backend entschluesselt die Verzeichnisliste, bevor serve s3 sie
  # ausgibt. Das NAS sieht also "nas-backup" - kein verschluesselter Name.
  args:
    - serve
    - s3
    # Anfuehrungszeichen noetig: "hetzner-crypt:" ist sonst YAML null.
    - "hetzner-crypt:"
    - --addr=:8080
    - --vfs-cache-mode writes
    - --no-checksum
    - --no-modtime

  env:
    # Lokale NAS-Zugangsberechtigung des Gateways, nicht die Hetzner-Credentials.
    # Bewusst per secretKeyRef statt in args: so steht das Klartext-Passwort
    # nicht im Deployment-Manifest und damit nicht in Git.
    # Der Wert ist CSV-kodiert und muss die Anfuehrungszeichen enthalten.
    - name: RCLONE_AUTH_KEY
      valueFrom:
        secretKeyRef:
          name: rclone-gateway-auth-secret
          key: RCLONE_AUTH_KEY
  network:
    http:
      containerPort: 8080
      servicePort: 8080
  # ClusterIP: Erreichbarkeit laeuft ausschliesslich ueber die Traefik-Route
  # in templates/rclone-route.yaml, nicht direkt aus dem LAN.
  service:
    type: ClusterIP
  readinessProbe:
    initialDelaySeconds: 5
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 6
    # tcpSocket statt httpGet: "rclone serve s3" beantwortet ein
    # unauthentifiziertes GET / mit HTTP 400 (empirisch mit v1.75.1
    # verifiziert), weil ListBuckets einen gueltigen SigV4-Request
    # verlangt. Ein httpGet-Probe wuerde daher dauerhaft fehlschlagen und
    # den Pod nie Ready werden lassen. Der TCP-Port ist dagegen ein
    # zuverlaessiges Signal fuer "serve s3 laeuft".
    tcpSocket:
      port: http
  resources:
    # Bewusst konservativ: geteilter Single-Node-MicroK8s-Cluster (10 Cores),
    # auf dem bereits Postgres, kutuapp, adventscalendar und Prometheus laufen.
    # Eine dauerhafte Reservierung von 4 Cores wuerde die anderen Workloads
    # verhungern lassen. Die AES-Verschluesselung in Echtzeit ist nicht
    # CPU-gebunden - der Engpass ist die Netzwerkbandbreite.
    requests:
      cpu: 0.5
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  # Das offizielle Image setzt XDG_CONFIG_HOME=/config, daher ist
  # /config/rclone/rclone.conf bereits der korrekte Default-Pfad.
  # Ein --config-Flag ist deshalb nicht noetig.
  volumeMounts:
    - mountPath: /config/rclone
      name: rclone-config
  volumes:
    - name: rclone-config
      secret:
        secretName: rclone-config
  # Single-Node-Cluster: die Standard-PodAntiAffinity des Charts wuerde die
  # Zustellung sonst verhindern.
  defaultAffinityRules:
    enabled: false
