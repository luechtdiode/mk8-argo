apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-route-s3-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3gw.interpolar.ch`)
      kind: Rule
      priority: 5
      services:
        - kind: Service
          name: s3-gateway
          port: http
    - match: HostRegexp(`^s3\.(.+)\.stargate$`)
      kind: Rule
      priority: 5
      services:
        - kind: Service
          name: opndrive
          port: http
