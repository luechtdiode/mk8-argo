# Traefik-Route fuer das Rclone-S3-Gateway, analog storj/templates/minio-ingress.yaml
# und kutuapp/templates/kutuapp-route-service.yaml.
#
# Kein TLS - wie bei minio.*.stargate. Der S3-Zugriff laeuft dadurch im Klartext
# ueber das LAN; die Absicherung erfolgt ueber die SigV4-Zugangsdaten des
# Gateways (RCLONE_AUTH_KEY), nicht ueber TLS.
#
# Der Portname "http" stammt aus dem Key unter network.http in values.yaml;
# das Generic-Chart leitet daraus Container-Port, Service-Port und Portnamen ab.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-route-s3gw
spec:
  entryPoints:
    - web
  routes:
    - match: HostRegexp(`^s3gw\.(.+)\.stargate$`)
      kind: Rule
      priority: 5
      services:
        - kind: Service
          name: s3-gateway
          port: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-route-s3gw-secured
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3gw.interpolar.ch`)
      kind: Rule
      priority: 5
      services:
        - kind: Service
          name: s3-gateway
          port: http
